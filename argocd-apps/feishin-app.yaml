apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: feishin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:alvish96/Elysium.git
    targetRevision: HEAD
    path: app-code/feishin
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
