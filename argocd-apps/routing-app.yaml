apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-routing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/alvish96/Elysium.git'
    targetRevision: HEAD
    path: app-code/routing
  # Even though this targets 'default', the namespaces declared in the 
  # multi-document YAML will override it and place rules appropriately.
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
