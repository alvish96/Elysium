---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: browser-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser
  namespace: media
  labels:
    app: browser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: browser
  template:
    metadata:
      labels:
        app: browser
    spec:
      nodeSelector:
        kubernetes.io/hostname: avalon
      containers:
        - name: firefox
          image: lscr.io/linuxserver/firefox:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1500m"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: browser-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: browser-svc
  namespace: media
spec:
  type: NodePort
  selector:
    app: browser
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 31880
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browser-ingress
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  rules:
    - host: browser.aura
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: browser-svc
                port:
                  number: 3000
