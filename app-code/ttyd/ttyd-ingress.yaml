apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ttyd-ingress
  namespace: monitoring
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`atlantis.fynbos-prometheus.ts.net`) && PathPrefix(`/ttyd`)
      kind: Rule
      priority: 10
      middlewares:
        - name: ttyd-stripprefix
          namespace: monitoring
        - name: authentik-forwardauth
          namespace: security
      services:
        - name: ttyd-svc
          port: 3022
