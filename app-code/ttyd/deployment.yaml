apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttyd
  namespace: monitoring
  labels:
    app: ttyd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ttyd
  template:
    metadata:
      labels:
        app: ttyd
    spec:
      nodeSelector:
        kubernetes.io/hostname: atlantis
      # === CRITICAL: ENABLE HOST NETWORK & PROCESS NAMESPACES ===
      hostNetwork: true
      hostPID: true
      containers:
        - name: ttyd
          image: tsl0922/ttyd:latest
          securityContext:
            privileged: true
          # Use a login shell and explicitly pass the K3s KUBECONFIG path
          command:
            - /bin/sh
            - -c
            - |
              ttyd -p 3022 -W -c "admin:MY_SECURE_PASSWORD" chroot /host /usr/bin/env KUBECONFIG=/etc/rancher/k3s/k3s.yaml /bin/bash --login
          ports:
            - containerPort: 3022
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: ttyd-svc
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: ttyd
  ports:
    - port: 3022
      targetPort: 3022
      nodePort: 30022
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ttyd-ingress
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`terminal.local`)
      kind: Rule
      services:
        - name: ttyd-svc
          port: 3022
