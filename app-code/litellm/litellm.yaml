---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: media
data:
  config.yaml: |
    model_list:
      - model_name: gemini-pro
        litellm_params:
          model: gemini/gemini-1.5-pro
          api_key: "os.environ/GEMINI_API_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: media
  labels:
    app: litellm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - avalon
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - phantom
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:latest
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
          env:
            # Inject API Key from Secret into environment for os.environ lookup
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GEMINI_API_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "2048Mi"
              cpu: "1500m"
          ports:
            - containerPort: 4000
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-svc
  namespace: media
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30400
