apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortivpn
  namespace: networking
  labels:
    app: fortivpn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fortivpn
  template:
    metadata:
      labels:
        app: fortivpn
      annotations:
        container.apparmor.security.beta.kubernetes.io/fortivpn: unconfined
        container.apparmor.security.beta.kubernetes.io/proxy: unconfined
    spec:
      nodeSelector:
        kubernetes.io/hostname: atlantis
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: Unconfined
      containers:
        # 1. THE FORTICLIENT SSL-VPN ENGINE
        - name: fortivpn
          image: alpine:3.20
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache openfortivpn ppp iptables iproute2 curl
              
              # Create /dev/ppp device node if not present
              if [ ! -c /dev/ppp ]; then
                mknod /dev/ppp c 108 0
              fi
              
              # Copy secret to a writable file with strict 0600 permissions
              mkdir -p /etc/openfortivpn
              cp /tmp/secret/config /etc/openfortivpn/config
              chmod 600 /etc/openfortivpn/config
              
              # NAT traffic routed into the pod out through ppp0
              iptables -t nat -A POSTROUTING -o ppp0 -j MASQUERADE
              
              echo "Starting openfortivpn..."
              exec openfortivpn -c /etc/openfortivpn/config
          volumeMounts:
            - name: vpn-config
              mountPath: /tmp/secret
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

        # 2. SIDECAR PROXY (SOCKS5 :1080 & HTTP :8888)
        - name: proxy
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apk add --no-cache microsocks tinyproxy
              cat << 'EOT' > /etc/tinyproxy/tinyproxy.conf
              User nobody
              Group nobody
              Port 8888
              Timeout 600
              LogLevel Info
              MaxClients 100
              Allow 0.0.0.0/0
              DisableViaHeader Yes
              EOT
              tinyproxy -c /etc/tinyproxy/tinyproxy.conf
              exec microsocks -i 0.0.0.0 -p 1080
          ports:
            - containerPort: 1080
              name: socks5
            - containerPort: 8888
              name: http-proxy
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: vpn-config
          secret:
            secretName: fortivpn-secret
---
apiVersion: v1
kind: Service
metadata:
  name: fortivpn-svc
  namespace: networking
  labels:
    app: fortivpn
spec:
  type: NodePort
  selector:
    app: fortivpn
  ports:
    - name: socks5
      port: 1080
      targetPort: 1080
      nodePort: 31080
    - name: http-proxy
      port: 8888
      targetPort: 8888
      nodePort: 31888
