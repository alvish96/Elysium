apiVersion: apps/v1
kind: Deployment
metadata:
  name: trawl
  namespace: media
  labels:
    app: trawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trawl
  template:
    metadata:
      labels:
        app: trawl
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            # Preferred Primary Node: avalon (Weight 100)
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - avalon
            # Preferred Failover Node: phantom (Weight 50)
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - phantom
      containers:
        - name: trawl
          image: ghcr.io/germondai/trawl:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8191
              name: http
          env:
            - name: PORT
              value: "8191"
            - name: BROWSER_POOL_SIZE
              value: "4"
            - name: BROWSER_TIMEOUT
              value: "30000"
            - name: MOZ_DISABLE_CONTENT_SANDBOX
              value: "1"
            - name: HOME
              value: "/tmp"
            - name: MOZ_ACCELERATED
              value: "0"
            - name: LOG_LEVEL
              value: "debug"
            # Route browser scraping contexts through Gluetun VPN
            - name: PROXY_URL
              value: "http://qbittorrent-svc:8888"
            - name: DEFAULT_PROXY
              value: "http://qbittorrent-svc:8888"
          volumeMounts:
            - name: trawl-data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
      volumes:
        # Temporary stateless storage per pod
        - name: trawl-data
          emptyDir: {}
        # Shared memory allocation for Firefox browser contexts
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trawl-svc
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: trawl
  ports:
    - name: http
      port: 8191
      targetPort: 8191
