apiVersion: apps/v1
kind: Deployment
metadata:
  name: trawl
  namespace: media
  labels:
    app: trawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trawl
  template:
    metadata:
      labels:
        app: trawl
    spec:
      nodeSelector:
        kubernetes.io/hostname: avalon
      containers:
        - name: trawl
          image: ghcr.io/germondai/trawl:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8191
              name: http
          env:
            - name: PORT
              value: "8191"
            # Expand browser pool size to 4 concurrent browsers
            - name: BROWSER_POOL_SIZE
              value: "4"
            # Auto-recycle hung sessions after 30 seconds
            - name: BROWSER_TIMEOUT
              value: "30000"
            # Route all browser traffic through qbittorrent VPN proxy
            - name: PROXY_URL
              value: "http://qbittorrent-svc:8888"
            - name: DEFAULT_PROXY
              value: "http://qbittorrent-svc:8888"
            - name: HTTP_PROXY
              value: "http://qbittorrent-svc:8888"
            - name: HTTPS_PROXY
              value: "http://qbittorrent-svc:8888"
          volumeMounts:
            - name: trawl-data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 512Mi
      volumes:
        - name: trawl-data
          persistentVolumeClaim:
            claimName: trawl-config-pvc
        # Allocate 1GB shared memory for the 4 browser instances
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trawl-svc
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: trawl
  ports:
    - name: http
      port: 8191
      targetPort: 8191
