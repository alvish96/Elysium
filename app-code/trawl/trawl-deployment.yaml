apiVersion: apps/v1
kind: Deployment
metadata:
  name: trawl
  namespace: media
  labels:
    app: trawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trawl
  template:
    metadata:
      labels:
        app: trawl
    spec:
      nodeSelector:
        kubernetes.io/hostname: avalon
      containers:
        - name: trawl
          image: ghcr.io/germondai/trawl:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8191
              name: http
          env:
            - name: PORT
              value: "8191"
            - name: BROWSER_POOL_SIZE
              value: "2"
          volumeMounts:
            - name: trawl-data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              cpu: "2"
              memory: 1536Mi
            requests:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: trawl-data
          persistentVolumeClaim:
            claimName: trawl-config-pvc
        # Allocate shared memory for Firefox browser pool
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trawl-svc
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: trawl
  ports:
    - name: http
      port: 8191
      targetPort: 8191
