apiVersion: v1
kind: PersistentVolume
metadata:
  name: trawl-config-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage-trawl
  local:
    path: /mnt/internal/appdata/trawl
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - avalon
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trawl-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-trawl
  resources:
    requests:
      storage: 5Gi
