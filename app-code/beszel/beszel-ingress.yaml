apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: beszel-ingress
  namespace: monitoring
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`atlantis.fynbos-prometheus.ts.net`) && PathPrefix(`/beszel`)
      kind: Rule
      priority: 10
      middlewares:
        - name: beszel-stripprefix
          namespace: monitoring
        - name: authentik-forwardauth
          namespace: security
      services:
        - name: beszel-hub-svc
          port: 8090
