apiVersion: v1
kind: PersistentVolume
metadata:
  name: youtube-stream-local-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage-ssd
  local:
    path: /mnt/phantom_share/appdata/youtube-stream
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - phantom
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: youtube-stream-local-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage-ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-streamer-tandberg
  namespace: media
  labels:
    app: youtube-streamer-tandberg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: youtube-streamer-tandberg
  template:
    metadata:
      labels:
        app: youtube-streamer-tandberg
    spec:
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        kubernetes.io/hostname: phantom
      containers:
        - name: ffmpeg
          image: linuxserver/ffmpeg:latest
          resources:
            requests:
              memory: "256Mi"
              cpu: "1000m"
            limits:
              memory: "1024Mi"
              cpu: "4000m"
          env:
            - name: YOUTUBE_KEY
              value: "j2uw-dy52-xskt-fqzs-c7ys"
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /dev
              name: host-dev
            - mountPath: /sys
              name: host-sys
            - mountPath: /tmp/stream-run
              name: temp-volume
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "Scanning kernel space for TANDBERG PrecisionHD Camera node..."
                TANDBERG_DEV=""
                
                for syspath in /sys/class/video4linux/video*; do
                  if cat "$syspath/name" 2>/dev/null | grep -q -i "TANDBERG"; then
                    TANDBERG_DEV="/dev/$(basename "$syspath")"
                    break
                  fi
                done
                
                if [ -z "$TANDBERG_DEV" ]; then
                  echo "CRITICAL: TANDBERG Hardware Camera not found on the USB bus! Retrying in 5 seconds..."
                  sleep 5
                  continue
                fi
                
                echo "Success! Target camera mapped on active node: $TANDBERG_DEV"
                
                # Determine audio source: loop audio.mp3 if present, otherwise fall back to silence
                AUDIO_ARGS="-thread_queue_size 1024 -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100"
                if [ -f "/tmp/stream-run/audio.mp3" ]; then
                  echo "Found /tmp/stream-run/audio.mp3. Looping background audio track..."
                  AUDIO_ARGS="-stream_loop -1 -i /tmp/stream-run/audio.mp3"
                else
                  echo "Notice: /tmp/stream-run/audio.mp3 not found. Falling back to silent audio."
                fi
                
                echo "Launching Native 720p 30fps Streaming Engine with Audio..."
                
                ffmpeg -loglevel info -fflags +genpts+nobuffer -flags low_delay \
                -thread_queue_size 1024 -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 30 -i "$TANDBERG_DEV" \
                $AUDIO_ARGS \
                -map 0:v:0 -map 1:a:0 \
                -c:v libx264 -preset ultrafast -tune zerolatency -b:v 3000k -maxrate 3500k -bufsize 6000k \
                -pix_fmt yuv420p -g 60 \
                -c:a aac -b:a 128k -ar 44100 \
                -f flv rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_KEY;
                
                echo "Connection dropped or camera link severed. Re-scanning system bus in 5 seconds..."
                sleep 5;
              done
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-sys
          hostPath:
            path: /sys
        - name: temp-volume
          persistentVolumeClaim:
            claimName: youtube-stream-local-pvc
