apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: media
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
      annotations:
        container.apparmor.security.beta.kubernetes.io/n8n: unconfined
    spec:
      nodeSelector:
        kubernetes.io/hostname: atlantis
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest
          securityContext:
            runAsUser: 0
          ports:
            - containerPort: 5678
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1500m"
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"
            - name: NODE_ENV
              value: "production"
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            - name: WEBHOOK_URL
              value: "http://192.168.1.160:30567/"
            - name: GENERIC_TIMEZONE
              value: "Asia/Kolkata"
            - name: TZ
              value: "Asia/Kolkata"
            - name: N8N_ENCRYPTION_KEY
              value: "ElysiumSecureN8nEncryptionKey2026RootMaster"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
            - name: N8N_ENABLE_EXECUTE_COMMAND
              value: "true"
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "n8n-db-svc"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            - name: DB_POSTGRESDB_USER
              value: "n8n_user"
            - name: DB_POSTGRESDB_PASSWORD
              value: "ElysiumN8nSecurePass2026"
            - name: N8N_ENABLED_MODULES
              value: "instance-ai"
            - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
              value: "true"
          volumeMounts:
            - name: elysium-repo
              mountPath: /root/Elysium
            - name: git-config
              mountPath: /root/.gitconfig
              # REMOVED subPath to prevent CreateContainerConfigError
            - name: ssh-keys
              mountPath: /root/.ssh
      volumes:
        - name: elysium-repo
          hostPath:
            path: /root/Elysium
            type: Directory
        - name: git-config
          hostPath:
            path: /root/.gitconfig
            type: FileOrCreate
        - name: ssh-keys
          hostPath:
            path: /root/.ssh
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-svc
  namespace: media
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      nodePort: 30567
