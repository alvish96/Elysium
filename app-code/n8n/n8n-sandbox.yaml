apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-sandbox
  namespace: media
  labels:
    app: n8n-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n-sandbox
  template:
    metadata:
      labels:
        app: n8n-sandbox
    spec:
      nodeSelector:
        kubernetes.io/hostname: atlantis
      # === MODERN K3S APPARMOR BYPASS FOR ALL CONTAINERS ===
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      volumes:
        - name: tls-data
          emptyDir: {}
      initContainers:
        - name: sandbox-certs
          image: n8nio/n8n-sandbox-service-api:latest
          # === NATIVE KUBERNETES ROOT EXECUTION ===
          securityContext:
            runAsUser: 0
          command:
            - 'sh'
            - '-c'
            - >
              bootstrap-mtls.sh --out-dir /tls --api-san localhost --control-san-prefix localhost --force &&
              chmod -R 777 /tls
          volumeMounts:
            - name: tls-data
              mountPath: /tls
      containers:
        - name: sandbox-api
          image: n8nio/n8n-sandbox-service-api:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NUM_RUNNERS
              value: "1"
            - name: SANDBOX_API_KEYS
              value: "ElysiumSandboxKey2026"
            - name: SANDBOX_API_RUNNER_REGISTRATION_TOKEN
              value: "ElysiumRunnerToken2026"
            - name: SANDBOX_API_GRPC_TLS_CA_CERT
              value: "/tls/api/ca.crt"
            - name: SANDBOX_API_GRPC_TLS_CERT
              value: "/tls/api/server.crt"
            - name: SANDBOX_API_GRPC_TLS_KEY
              value: "/tls/api/server.key"
          volumeMounts:
            - name: tls-data
              mountPath: /tls
        - name: sandbox-runner
          image: n8nio/n8n-sandbox-service-runner-dind:latest
          securityContext:
            privileged: true
          env:
            - name: SANDBOX_RUNNER_API_KEYS
              value: "ElysiumSandboxKey2026"
            - name: SANDBOX_RUNNER_REGISTRATION_TOKEN
              value: "ElysiumRunnerToken2026"
            - name: SANDBOX_RUNNER_API_GRPC_ADDR
              value: "localhost:8081"
            - name: SANDBOX_RUNNER_API_GRPC_TLS_CA_CERT
              value: "/tls/runner/ca.crt"
            - name: SANDBOX_RUNNER_API_GRPC_TLS_CERT
              value: "/tls/runner/client.crt"
            - name: SANDBOX_RUNNER_API_GRPC_TLS_KEY
              value: "/tls/runner/client.key"
          volumeMounts:
            - name: tls-data
              mountPath: /tls
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-sandbox-svc
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: n8n-sandbox
  ports:
    - name: http
      port: 3200
      targetPort: 8080
