apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-sandbox
  namespace: media
  labels:
    app: n8n-sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n-sandbox
  template:
    metadata:
      labels:
        app: n8n-sandbox
    spec:
      nodeSelector:
        kubernetes.io/hostname: atlantis
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      volumes:
        - name: tls-data
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
      initContainers:
        # === 1. DETERMINISTIC MTLS CERTIFICATE GENERATOR ===
        - name: sandbox-certs
          image: n8nio/n8n-sandbox-service-api:latest
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /tls/api /tls/runner /tmp/certs
              cd /tmp/certs

              # 1. Generate Root CA
              openssl req -x509 -newkey rsa:2048 -days 3650 -nodes \
                -keyout ca.key -out ca.crt \
                -subj "/CN=n8n-sandbox-ca"

              # 2. Certificate Extension Config (SANs & Key Usages)
              cat << 'SAN_EOF' > san.cnf
              [v3_req]
              basicConstraints = CA:FALSE
              keyUsage = digitalSignature, keyEncipherment
              extendedKeyUsage = serverAuth, clientAuth
              subjectAltName = @alt_names

              [alt_names]
              DNS.1 = localhost
              DNS.2 = runner
              DNS.3 = n8n-sandbox
              DNS.4 = n8n-sandbox-svc
              IP.1 = 127.0.0.1
              SAN_EOF

              # 3. Generate API Key Pair & Sign
              openssl req -newkey rsa:2048 -nodes -keyout api.key -out api.csr -subj "/CN=localhost"
              openssl x509 -req -in api.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out api.crt -days 3650 -extfile san.cnf -extensions v3_req

              # 4. Generate Runner Key Pair & Sign
              openssl req -newkey rsa:2048 -nodes -keyout runner.key -out runner.csr -subj "/CN=localhost"
              openssl x509 -req -in runner.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out runner.crt -days 3650 -extfile san.cnf -extensions v3_req

              # 5. Populate /tls/api
              cp ca.crt /tls/api/ca.crt
              cp api.crt /tls/api/server.crt
              cp api.key /tls/api/server.key
              cp api.crt /tls/api/client.crt
              cp api.key /tls/api/client.key

              # 6. Populate /tls/runner
              cp ca.crt /tls/runner/ca.crt
              cp runner.crt /tls/runner/server.crt
              cp runner.key /tls/runner/server.key
              cp runner.crt /tls/runner/client.crt
              cp runner.key /tls/runner/client.key

              chmod -R 777 /tls
          volumeMounts:
            - name: tls-data
              mountPath: /tls
      containers:
        # === 2. SANDBOX API GATEWAY ===
        - name: sandbox-api
          image: n8nio/n8n-sandbox-service-api:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: grpc
          env:
            - name: NUM_RUNNERS
              value: "1"
            - name: SANDBOX_API_KEYS
              value: "ElysiumSandboxKey2026"
            - name: SANDBOX_API_RUNNER_REGISTRATION_TOKEN
              value: "ElysiumRunnerToken2026"
            # Registry Server mTLS (Inbound from Runner)
            - name: SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE
              value: "/tls/api/ca.crt"
            - name: SANDBOX_API_GRPC_TLS_CERT_FILE
              value: "/tls/api/server.crt"
            - name: SANDBOX_API_GRPC_TLS_KEY_FILE
              value: "/tls/api/server.key"
            # Control Client mTLS (Outbound to Runner)
            - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE
              value: "/tls/api/ca.crt"
            - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE
              value: "/tls/api/client.crt"
            - name: SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
              value: "/tls/api/client.key"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: tls-data
              mountPath: /tls
        # === 3. DOCKER-IN-DOCKER RUNNER ===
        - name: sandbox-runner
          image: n8nio/n8n-sandbox-service-runner-dind:latest
          securityContext:
            privileged: true
          env:
            - name: SANDBOX_RUNNER_API_KEYS
              value: "ElysiumSandboxKey2026"
            - name: SANDBOX_RUNNER_REGISTRATION_TOKEN
              value: "ElysiumRunnerToken2026"
            - name: SANDBOX_RUNNER_API_GRPC_ADDR
              value: "127.0.0.1:8081"
            # Registration Client mTLS
            - name: SANDBOX_RUNNER_API_GRPC_TLS_CA_FILE
              value: "/tls/runner/ca.crt"
            - name: SANDBOX_RUNNER_API_GRPC_TLS_CERT_FILE
              value: "/tls/runner/client.crt"
            - name: SANDBOX_RUNNER_API_GRPC_TLS_KEY_FILE
              value: "/tls/runner/client.key"
            # Control Server mTLS
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE
              value: "/tls/runner/ca.crt"
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CA_FILE
              value: "/tls/runner/ca.crt"
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE
              value: "/tls/runner/server.crt"
            - name: SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE
              value: "/tls/runner/server.key"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "2000m"
          volumeMounts:
            - name: tls-data
              mountPath: /tls
            - name: dind-storage
              mountPath: /var/lib/docker
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-sandbox-svc
  namespace: media
spec:
  type: ClusterIP
  selector:
    app: n8n-sandbox
  ports:
    - name: http
      port: 3200
      targetPort: 8080
