apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homarr-ingress
  namespace: media
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`nexus.link`) || Host(`homarr.nexus.link`) || Host(`100.110.100.1`)
      kind: Rule
      services:
        - name: homarr-svc
          port: 7575
