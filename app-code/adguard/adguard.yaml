---
apiVersion: v1
kind: Namespace
metadata:
  name: networking
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: adguard-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  local:
    path: /mnt/internal/appdata/adguard
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - atlantis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-pvc
  namespace: networking
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      nodeSelector:
        kubernetes.io/hostname: atlantis
      containers:
        - name: adguard
          image: adguard/adguardhome:latest
          ports:
            # Removed hostPort so the LoadBalancer can bind properly!
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
            # Internal Web UI Port
            - containerPort: 3000
          volumeMounts:
            - name: adguard-data
              mountPath: /opt/adguardhome/work
            - name: adguard-data
              mountPath: /opt/adguardhome/conf
      volumes:
        - name: adguard-data
          persistentVolumeClaim:
            claimName: adguard-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-svc
  namespace: networking
spec:
  selector:
    app: adguard
  type: NodePort
  ports:
    - name: webui
      port: 3000
      targetPort: 3000
      nodePort: 30053
