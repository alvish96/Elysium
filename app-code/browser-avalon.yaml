---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: browser-avalon-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-session
  namespace: media
  labels:
    app: browser-session
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: browser-session
  template:
    metadata:
      labels:
        app: browser-session
    spec:
      nodeSelector:
        kubernetes.io/hostname: avalon
      containers:
        - name: firefox
          image: lscr.io/linuxserver/firefox:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1500m"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: browser-avalon-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: browser-session-svc
  namespace: media
spec:
  type: NodePort
  selector:
    app: browser-session
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30885
