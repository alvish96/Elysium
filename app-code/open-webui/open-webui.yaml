---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: media
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - avalon
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - phantom
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          env:
            - name: WEBUI_SECRET_KEY
              value: "elysium-open-webui-secret-key"
            - name: DATABASE_URL
              value: "postgresql://webui:webui-secure-pass@open-webui-db-svc:5432/openwebui"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            
            # Pull individual API keys from K8s Secret
            - name: GEMINI_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: GEMINI_API_KEY
            - name: OPENROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: OPENROUTER_API_KEY
            - name: COPILOT_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: COPILOT_API_KEY
            - name: COPILOT_URL
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: COPILOT_BASE_URL

            # Combine endpoints and keys into semicolon-separated lists
            - name: OPENAI_API_BASE_URLS
              value: "https://generativelanguage.googleapis.com/v1beta/openai/;https://openrouter.ai/api/v1;$(COPILOT_URL)"
            - name: OPENAI_API_KEYS
              value: "$(GEMINI_KEY);$(OPENROUTER_KEY);$(COPILOT_KEY)"

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2048Mi"
              cpu: "1500m"
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-svc
  namespace: media
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30888
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ai.aura
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui-svc
                port:
                  number: 8080
