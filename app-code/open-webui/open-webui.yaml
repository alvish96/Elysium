---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: media
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - avalon
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - phantom
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          env:
            - name: WEBUI_SECRET_KEY
              value: "elysium-open-webui-secret-key"
            
            # Use the Postgres Database on Atlantis
            - name: DATABASE_URL
              value: "postgresql://webui:webui-secure-pass@open-webui-db-svc:5432/openwebui"

            # Enable Google Gemini API
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: "https://generativelanguage.googleapis.com/v1beta/openai/"
            # Ensure you replace this with your actual Gemini API Key later
            - name: OPENAI_API_KEY
              value: "AQ.Ab8RN6KptZ0OEWs_JyXYdo0Z_CHtspm739P7r2aRCpDWoUpstw"
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1500m"
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui-svc
  namespace: media
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30888
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-ingress
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ai.aura
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui-svc
                port:
                  number: 8080
