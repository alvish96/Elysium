apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-sync-api
  namespace: media
  labels:
    app: nexus-sync-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus-sync-api
  template:
    metadata:
      labels:
        app: nexus-sync-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: atlantis
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: api
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "==> Preparing Python Virtual Environment for Nexus Sync API..."
              if [ ! -f /opt/venv/bin/uvicorn ]; then
                echo "--> Initializing persistent virtual environment in /opt/venv..."
                python3 -m venv /opt/venv
                echo "--> Installing dependencies from requirements.txt..."
                /opt/venv/bin/pip install --no-cache-dir -r /app/requirements.txt
              fi
              echo "==> Starting Nexus Sync API on port 8000..."
              exec /opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: nexus-music-secrets
          env:
            - name: POSTGRES_HOST
              value: "nexus-sync-postgres-svc.media.svc.cluster.local"
            - name: REDIS_HOST
              value: "nexus-sync-redis-svc.media.svc.cluster.local"
            - name: NAVIDROME_URL
              value: "http://navidrome-svc.media.svc.cluster.local:4533"
            - name: MUSIC_ROOT
              value: "/mnt/audio_pool/music"
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: venv-data
              mountPath: /opt/venv
            - name: audio-pool
              mountPath: /mnt/audio_pool/music
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: app-code
          hostPath:
            path: /root/Elysium/nexus-music/src/backend
            type: Directory
        - name: venv-data
          hostPath:
            path: /mnt/internal/appdata/nexus-sync/venv
            type: DirectoryOrCreate
        - name: audio-pool
          hostPath:
            path: /mnt/audio_pool/music
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-sync-api-svc
  namespace: media
  labels:
    app: nexus-sync-api
spec:
  type: ClusterIP
  selector:
    app: nexus-sync-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nexus-sync-ingress
  namespace: media
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`sync.nexus.link`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: nexus-sync-api-svc
          port: 8000
