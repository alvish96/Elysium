apiVersion: batch/v1
kind: CronJob
metadata:
  name: music-sync
  namespace: media
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60
      template:
        metadata:
          labels:
            app: music-sync
        spec:
          restartPolicy: OnFailure
          dnsPolicy: ClusterFirst
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          nodeSelector:
            kubernetes.io/hostname: atlantis
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          containers:
            - name: spotdl
              image: spotdl/spotify-downloader:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  
                  if [ -x "/app/.venv/bin/spotdl" ]; then
                    SPOTDL="/app/.venv/bin/spotdl"
                  elif command -v spotdl >/dev/null 2>&1; then
                    SPOTDL="spotdl"
                  else
                    SPOTDL="uv run --project /app spotdl"
                  fi

                  # -------------------------------------------------------------
                  # LIST YOUR PLAYLISTS HERE: "FolderName|Spotify_Playlist_URL"
                  # -------------------------------------------------------------
                  PLAYLISTS="
                  bring_this_in|https://open.spotify.com/playlist/34NpLvuEMI0rv8C9w30wCA
                  # workout|https://open.spotify.com/playlist/YOUR_PLAYLIST_ID_2
                  peace|https://open.spotify.com/playlist/1oSsW4AGbiX6U4tOWX8EeF?si=9c6e466aeb1c4a13
                  # chill_vibes|https://open.spotify.com/playlist/YOUR_PLAYLIST_ID_3
                  letmebe|https://open.spotify.com/album/4mqcYdXFQJGtduC8XWX8op?si=88n4J44mQe-nDX3jGcqaKw
                  "

                  echo "$PLAYLISTS" | while IFS='|' read -r FOLDER_NAME PLAYLIST_URL; do
                    FOLDER_NAME=$(echo "$FOLDER_NAME" | xargs)
                    PLAYLIST_URL=$(echo "$PLAYLIST_URL" | xargs)

                    case "$FOLDER_NAME" in \#*|"") continue ;; esac

                    TARGET_DIR="/music/${FOLDER_NAME}"
                    SYNC_FILE="${TARGET_DIR}/.playlist.sync.spotdl"

                    echo "========================================================"
                    echo " Processing Playlist: [${FOLDER_NAME}]"
                    echo " Target Folder:       ${TARGET_DIR}"
                    echo "========================================================"

                    mkdir -p "$TARGET_DIR"
                    cd "$TARGET_DIR"

                    if [ ! -f "$SYNC_FILE" ]; then
                      echo "--> Initializing sync tracking..."
                      $SPOTDL sync "$PLAYLIST_URL" \
                        --save-file "$SYNC_FILE" \
                        --sync-without-deleting \
                        --output "${TARGET_DIR}/{artist} - {title}.{ext}" \
                        --format mp3 \
                        --bitrate 320k \
                        --simple-tui \
                        --log-level INFO
                    else
                      echo "--> Checking for new songs..."
                      $SPOTDL sync "$SYNC_FILE" \
                        --sync-without-deleting \
                        --output "${TARGET_DIR}/{artist} - {title}.{ext}" \
                        --format mp3 \
                        --bitrate 320k \
                        --simple-tui \
                        --log-level INFO
                    fi

                    echo "--> Finished playlist: ${FOLDER_NAME}"
                  done

                  echo "All playlists synced successfully."
              env:
                - name: PATH
                  value: "/app/.venv/bin:/usr/local/bin:/usr/bin:/bin"
              volumeMounts:
                - name: music-root
                  mountPath: /music
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
          volumes:
            - name: music-root
              hostPath:
                path: /mnt/audio_pool/music
                type: DirectoryOrCreate
