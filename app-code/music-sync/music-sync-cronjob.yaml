apiVersion: batch/v1
kind: CronJob
metadata:
  name: music-sync
  namespace: media
spec:
  schedule: "0 */2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: music-sync
        spec:
          restartPolicy: OnFailure
          dnsPolicy: ClusterFirst
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          nodeSelector:
            kubernetes.io/hostname: atlantis
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          containers:
            - name: spotdl
              image: spotdl/spotify-downloader:latest
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  echo "Starting Spotify Playlist Ingestion..."
                  cd /music
                  
                  if [ -x "/app/.venv/bin/spotdl" ]; then
                    SPOTDL="/app/.venv/bin/spotdl"
                  elif command -v spotdl >/dev/null 2>&1; then
                    SPOTDL="spotdl"
                  else
                    SPOTDL="python3 -m spotdl"
                  fi
                  
                  PLAYLIST_URL="https://open.spotify.com/playlist/34NpLvuEMI0rv8C9w30wCA"
                  SYNC_FILE="/music/.playlist.sync.spotdl"
                  
                  # Download audio directly without VPN proxy and skip problematic lyric lookups
                  $SPOTDL sync "$PLAYLIST_URL" \
                    --save-file "$SYNC_FILE" \
                    --sync-without-deleting \
                    --output "/music/{artist} - {title}.{ext}" \
                    --format mp3 \
                    --bitrate 320k \
                    --lyrics-providers "" \
                    --simple-tui \
                    --log-level INFO
                  
                  echo "Sync complete."
              env:
                - name: PATH
                  value: "/app/.venv/bin:/usr/local/bin:/usr/bin:/bin"
              volumeMounts:
                - name: audio-pool
                  mountPath: /music
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
          volumes:
            - name: audio-pool
              hostPath:
                path: /mnt/audio_pool/music/Spotify_Singles
                type: DirectoryOrCreate
