# ==========================================
# 1. ATLANTIS NODE (192.168.1.160)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: glances-atlantis-svc
  namespace: monitoring
spec:
  ports:
    - port: 61208
      targetPort: 61208
---
apiVersion: v1
kind: Endpoints
metadata:
  name: glances-atlantis-svc
  namespace: monitoring
subsets:
  - addresses:
      - ip: 192.168.1.160
    ports:
      - port: 61208
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: glances-atlantis-ingress
  namespace: monitoring
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`glances-atlantis.nexus.link`)
      kind: Rule
      middlewares: [{name: authentik-forwardauth, namespace: monitoring}]
      services: [{name: glances-atlantis-svc, port: 61208}]

