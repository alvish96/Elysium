apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: glances-ingress
  namespace: monitoring
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`glances.nexus.link`)
      kind: Rule
      middlewares: [{name: authentik-forwardauth, namespace: monitoring}]
      services: [{name: glances-svc, port: 61208}] # Standard Glances Port
