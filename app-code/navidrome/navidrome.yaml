apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
  labels:
    app: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      nodeSelector:
        kubernetes.io/hostname: atlantis
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: navidrome
          image: deluan/navidrome:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4533
              name: http
          env:
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_DATAFOLDER
              value: "/data"
            - name: ND_SCANNER_SCHEDULE
              value: "@every 15m"
            - name: ND_AUTOIMPORTPLAYLISTS
              value: "true"
            - name: ND_DEFAULTPLAYLISTPUBLIC
              value: "false"
            - name: ND_SUBSONICARTISTPARTICIPATIONS
              value: "true"
            - name: ND_ENABLETRANSCODINGCONFIG
              value: "true"
            - name: ND_ENABLESHARING
              value: "true"
            - name: ND_LOGLEVEL
              value: "info"
          volumeMounts:
            - name: navidrome-data
              mountPath: /data
            - name: audio-pool
              mountPath: /music
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: navidrome-data
          hostPath:
            path: /mnt/internal/appdata/navidrome
            type: DirectoryOrCreate
        - name: audio-pool
          hostPath:
            path: /mnt/audio_pool/music
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome-svc
  namespace: media
  labels:
    app: navidrome
spec:
  type: NodePort
  selector:
    app: navidrome
  ports:
    - name: http
      port: 4533
      targetPort: 4533
      nodePort: 30545
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome-ingress
  namespace: media
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`navidrome.nexus.link`)
      kind: Rule
      services:
        - name: navidrome-svc
          port: 4533
