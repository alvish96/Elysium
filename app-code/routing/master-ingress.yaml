---
# ==============================================================================
# ARGOCD GITOPS NAMESPACE ROUTE
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress-aura
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: traefik
    # Forces Traefik to speak HTTPS to the ArgoCD backend to prevent redirect loops
    traefik.ingress.kubernetes.io/service.serversscheme: https
spec:
  rules:
    - host: gitops.aura
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
