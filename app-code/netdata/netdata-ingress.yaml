# ==========================================
# 1. ATLANTIS NODE (192.168.1.160)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: netdata-atlantis-svc
  namespace: monitoring
spec:
  ports:
    - port: 19999
      targetPort: 19999
---
apiVersion: v1
kind: Endpoints
metadata:
  name: netdata-atlantis-svc
  namespace: monitoring
subsets:
  - addresses:
      - ip: 192.168.1.160
    ports:
      - port: 19999
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netdata-atlantis-ingress
  namespace: monitoring
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`netdata-atlantis.nexus.link`)
      kind: Rule
      middlewares: [{name: authentik-forwardauth, namespace: monitoring}]
      services: [{name: netdata-atlantis-svc, port: 19999}]

